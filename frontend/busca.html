<!doctype html>
<html lang="pt-BR" data-tema="escuro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0d1111" />
        <title>Buscar · IndieSquad</title>
        <link rel="icon" href="static/assets/icone.svg" type="image/svg+xml" />

        <!-- o tema vem antes de tudo pra tela ja nascer na cor certa -->
        <script src="static/js/interface/tema/tema.js"></script>
        <script src="static/mosaic-ui/mosaic-inicio.js"></script>

        <link rel="stylesheet" href="static/mosaic-ui/mosaic.css" />
        <link rel="stylesheet" href="static/style/tokens.css" />
        <link rel="stylesheet" href="static/style/base.css" />
        <link rel="stylesheet" href="static/style/componentes.css" />
        <link rel="stylesheet" href="static/style/telas.css" />

        <script type="module" src="static/js/interface/indie.js"></script>
    </head>
    <body class="telaApp">
        <div class="mo-app">
            <header class="mo-cabecalho cabecalhoApp">
                <a class="logoIndie" href="dashboard.html" aria-label="IndieSquad, voltar pro painel">
                    <is-marca></is-marca>
                    <span class="nomeMarca">indiesquad</span>
                </a>

                <form class="mo-busca buscaRapida" role="search">
                    <i class="mo-lupa" aria-hidden="true"></i>
                    <input type="search" placeholder="Buscar pessoas ou projetos" aria-label="Buscar pessoas ou projetos" data-mo-atalho="/" autocomplete="off" />
                    <kbd class="mo-atalho">/</kbd>
                </form>

                <div class="acoesCabecalho">
                    <button type="button" class="mo-tecla mo-tecla--sutil mo-tecla--icone botaoTema" onclick="trocarTema(event)" aria-label="Trocar entre tema claro e escuro" title="Trocar tema">
                            <mo-simbolo nome="sol" class="iconeSol"></mo-simbolo>
                            <mo-simbolo nome="lua" class="iconeLua"></mo-simbolo>
                        </button>

                    <a class="chipUsuario" href="perfil.html">
                        <is-sprite semente="?" data-jogador-sprite></is-sprite>
                        <span class="textoChip" data-jogador-nome></span>
                    </a>

                    <button class="mo-alternar-lateral" data-mo-gaveta aria-label="Abrir menu"><i></i><i></i><i></i></button>
                </div>
            </header>

            <div class="mo-corpo">
                <mo-pixels class="mo-fundo" opacidade="0.14" cores="--is-arte --is-design --is-programacao"></mo-pixels>

                <nav class="mo-lateral menuApp" aria-label="Navegação principal">
                        <a href="dashboard.html" class="mo-nav-item">
                            <mo-simbolo nome="casa"></mo-simbolo>
                            <span class="mo-nav-texto">Painel</span>
                        </a>
                        <a href="busca.html" class="mo-nav-item ativo" aria-current="page">
                            <i class="mo-pilula" aria-hidden="true"></i>
                            <mo-simbolo nome="busca"></mo-simbolo>
                            <span class="mo-nav-texto">Buscar</span>
                        </a>
                        <a href="publicar-projeto.html" class="mo-nav-item">
                            <mo-simbolo nome="mais"></mo-simbolo>
                            <span class="mo-nav-texto">Publicar projeto</span>
                        </a>
                        <a href="minhas-candidaturas.html" class="mo-nav-item">
                            <mo-simbolo nome="check"></mo-simbolo>
                            <span class="mo-nav-texto">Candidaturas</span>
                        </a>
                        <a href="perfil.html" class="mo-nav-item">
                            <mo-simbolo nome="usuario"></mo-simbolo>
                            <span class="mo-nav-texto">Meu perfil</span>
                        </a>

                    <div class="peMenu">
                        <div class="cartaoJogador">
                            <is-sprite semente="?" data-jogador-sprite></is-sprite>
                            <strong data-jogador-nome></strong>
                            <span data-jogador-handle></span>
                        </div>

                        <button type="button" class="botaoSair" onclick="fazerLogout()">
                            <mo-simbolo nome="sair"></mo-simbolo>
                            Sair
                        </button>
                    </div>
                </nav>

                <main class="mo-conteudo">
                    <div class="paginaApp">
                        <header class="topoTela">
                            <p class="sobretitulo">Recrutar</p>
                            <h1>Encontre quem falta na sua equipe.</h1>
                            <p class="apoio">Pessoas por função e nível, ou projetos com vaga aberta.</p>
                        </header>

                        <div class="painelBusca">
                            <div class="linhaBusca">
                                <label class="caixaBusca">
                                    <mo-simbolo nome="busca"></mo-simbolo>
                                    <input type="search" id="campoBusca" placeholder="Nome, função ou projeto" autocomplete="off" aria-label="Buscar" />
                                </label>

                                <div class="abasBusca" role="tablist" aria-label="O que buscar">
                                    <button type="button" class="abaBusca ativo" id="abaProfissionais">Pessoas</button>
                                    <button type="button" class="abaBusca" id="abaProjetos">Projetos</button>
                                </div>
                            </div>

                            <div class="blocoFiltros">
                                <div class="filtrosClasses" id="filtrosCategorias"></div>
                                <div class="filtrosFuncoes escondido" id="filtrosSkills"></div>
                            </div>
                        </div>

                        <section class="secaoTela">
                            <h2 class="tituloSecao">
                                Resultados
                                <span class="contador" id="contagemResultados">0</span>
                            </h2>

                            <div class="tabela tabelaResultados" id="tabelaResultados">
                                <div class="tabelaTopo" id="topoResultados"></div>
                                <div class="corpoTabela" id="listaResultados"></div>
                            </div>
                        </section>
                    </div>
                </main>
            </div>

            <footer class="mo-rodape rodapeStatus">
                <span class="statusApi" id="statusApi"><i class="mo-pulso" aria-hidden="true"></i><span>conectando</span></span>
                <span id="statusNumeros"></span>
                <div class="direita">
                    <span>indiesquad 1.8</span>
                    <span class="atalhoBusca"><kbd>/</kbd> busca</span>
                </div>
            </footer>
        </div>

        <script src="static/js/nucleo/dom.js"></script>
        <script src="static/js/nucleo/api.js"></script>
        <script src="static/js/nucleo/formato.js"></script>
        <script src="static/js/autenticacao/sessao.js"></script>
        <script src="static/js/autenticacao/senha.js"></script>
        <script src="static/js/funcoes/classes.js"></script>
        <script src="static/js/funcoes/catalogo.js"></script>
        <script src="static/js/perfil/fotoPerfil/fotoPerfil.js"></script>
        <script src="static/js/projeto/capa/capa.js"></script>
        <script src="static/js/interface/icones.js"></script>
        <script src="static/js/interface/casca/casca.js"></script>
        <script src="static/js/busca/busca.js"></script>
    </body>
</html>
