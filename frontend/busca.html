<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Buscar - IndieSquad</title>

        <link rel="stylesheet" href="static/style/style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="layoutPagina">
            <aside class="menuLateral">
                <div>
                    <div class="logoMenuLateral">
                        <img src="static/assets/Logo.svg" alt="" />
                        <h3>INDIE<span>SQUAD</span></h3>
                    </div>

                    <div class="navegacaoMenuLateral">
                        <a href="dashboard.html" class="itemMenuLateral">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            Dashboard
                        </a>
                        <a href="busca.html" class="itemMenuLateral ativo">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2"/></svg>
                            Buscar
                        </a>
                        <a href="publicar-projeto.html" class="itemMenuLateral">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2"/><line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                            Publicar Projeto
                        </a>
                        <a href="perfil.html" class="itemMenuLateral">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg>
                            Meu Perfil
                        </a>
                    </div>
                </div>

                <button type="button" class="botaoSair" onclick="fazerLogout()">
                    <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="16 16 21 12 16 8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                    Sair
                </button>
            </aside>

            <main class="conteudoPagina">
                <div class="topoBusca">
                    <h1>Buscar</h1>
                </div>

                <div class="linhaBusca">
                    <div class="caixaBusca">
                        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2"/></svg>
                        <input type="text" id="campoBusca" placeholder="Buscar profissionais ou projetos" />
                    </div>

                    <div class="abasBusca">
                        <button type="button" class="abaBusca" id="abaProjetos">
                            Projetos
                            <svg viewBox="0 0 24 24" width="14" height="14"><rect x="4" y="4" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button type="button" class="abaBusca ativo" id="abaProfissionais">
                            Profissionais
                            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg>
                        </button>
                    </div>
                </div>

                <div class="filtrosSkills" id="filtrosSkills"></div>

                <div class="listaResultados" id="listaResultados"></div>
            </main>
        </div>

        <script src="static/js/app.js"></script>
        <script src="static/js/busca.js"></script>
    </body>
</html>
