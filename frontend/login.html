<!doctype html>
<html lang="pt-BR" data-tema="escuro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0e100f" />
        <title>Entrar - IndieSquad</title>

        <link rel="preload" href="static/mosaic-ui/fontes/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="static/mosaic-ui/mosaic.css" />
        <link rel="stylesheet" href="static/style/tema-indiesquad.css" />
        <link rel="stylesheet" href="static/style/indiesquad.css" />

        <script src="static/mosaic-ui/mosaic-inicio.js"></script>
        <script src="static/js/tema.js"></script>
    </head>

    <body class="corpoLogin">
        <main class="paginaLogin">
            <div class="topoLogin">
                <a class="botaoLogo" href="index.html">
                    <div class="logo">
                        <img src="static/assets/Logo.svg" alt=""/>
                        <h3>INDIE<span>SQUAD</span></h3>
                    </div>
                </a>

                <button type="button" class="botaoTema" onclick="trocarTema()" aria-label="Trocar entre tema claro e escuro" title="Trocar tema">
                    <svg class="iconeSol" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.1M12 19.3v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"/></svg>
                    <svg class="iconeLua" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
                </button>
            </div>

            <div class="cardLogin">
                <h2>Entrar</h2>
                <h3>Acesse sua conta IndieSquad</h3>

                <form class="formLogin" id="formLogin">
                    <div class="campoFormulario">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required />
                    </div>

                    <div class="campoFormulario">
                        <label for="senha">Senha</label>
                        <div class="caixaSenha">
                            <input type="password" id="senha" name="senha" placeholder="••••••••" required />
                            <button type="button" class="botaoOlho" id="botaoOlho">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 128C147.3 128 21.6 245.7 3.5 262.4C-1.2 266.8-1.2 274.2 3.5 278.6C21.6 295.3 147.3 413 320 413C492.7 413 618.4 295.3 636.5 278.6C641.2 274.2 641.2 266.8 636.5 262.4C618.4 245.7 492.7 128 320 128zM320 349C275.3 349 239 312.7 239 268C239 223.3 275.3 187 320 187C364.7 187 401 223.3 401 268C401 312.7 364.7 349 320 349z"/></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="mo-tecla mo-tecla--destaque botaoEnviar">Entrar</button>
                    <p class="mensagemErro" id="mensagemErro"></p>
                </form>

                <a class="linkCadastro" href="cadastro.html">Não tem conta? <span>Cadastre-se</span></a>
            </div>
        </main>

        <script type="module" src="static/mosaic-ui/mosaic.js"></script>
        <script src="static/js/app.js"></script>
        <script src="static/js/login.js"></script>
    </body>
</html>
