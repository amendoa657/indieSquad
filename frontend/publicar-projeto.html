<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Publicar Projeto - IndieSquad</title>

        <link rel="stylesheet" href="static/style/style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="layoutPagina">
            <aside class="menuLateral">
                <div>
                    <div class="logoMenuLateral">
                        <img src="static/assets/Logo.svg" alt="" />
                        <h3>INDIE<span>SQUAD</span></h3>
                    </div>

                    <div class="navegacaoMenuLateral">
                        <a href="dashboard.html" class="itemMenuLateral">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            Dashboard
                        </a>
                        <a href="busca.html" class="itemMenuLateral">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2"/></svg>
                            Buscar
                        </a>
                        <a href="publicar-projeto.html" class="itemMenuLateral ativo">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2"/><line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                            Publicar Projeto
                        </a>
                        <a href="perfil.html" class="itemMenuLateral">
                            <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg>
                            Meu Perfil
                        </a>
                    </div>
                </div>

                <button type="button" class="botaoSair" onclick="fazerLogout()">
                    <svg class="iconeMenuLateral" viewBox="0 0 24 24" width="18" height="18"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="16 16 21 12 16 8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                    Sair
                </button>
            </aside>

            <main class="conteudoPagina conteudoEstreito">
                <div class="topoPagina">
                    <h1>Publicar Projeto</h1>
                    <h3>Conte pra gente sobre o seu jogo</h3>
                </div>

                <p class="mensagemErro" id="mensagemErro"></p>

                <form id="formPublicarProjeto">
                    <div class="etapaPublicar etapaAtiva">
                        <div class="campoFormulario">
                            <label for="nomeProjeto">Nome do Projeto</label>
                            <input type="text" id="nomeProjeto" placeholder="Ex: Hollow Depths" required />
                        </div>

                        <div class="campoFormulario">
                            <label for="descricaoProjeto">Descrição curta</label>
                            <textarea id="descricaoProjeto" placeholder="Descreva seu jogo em poucas linhas..." required></textarea>
                        </div>

                        <div class="campoFormulario">
                            <label for="generoProjeto">Gênero</label>
                            <input type="text" id="generoProjeto" placeholder="Ex: Metroidvania, RPG, Puzzle..." />
                        </div>

                        <div class="campoFormulario">
                            <label for="engineProjeto">Engine / Ferramenta</label>
                            <input type="text" id="engineProjeto" placeholder="Ex: Unity, Godot, Unreal..." />
                        </div>

                        <div class="campoFormulario">
                            <label>Perfis necessários</label>
                            <div class="botoesPerfil">
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Artista 2D</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Artista 3D</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Animador</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Compositor</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Sound Designer</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Dublador</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Roteirista</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Programador</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">Game Designer</button>
                                <button type="button" class="botaoPerfil" onclick="this.classList.toggle('ativo')">QA Tester</button>
                            </div>
                        </div>

                        <div class="campoFormulario">
                            <label for="marcoProjeto">Marcos do projeto</label>
                            <input type="text" id="marcoProjeto" class="campoMarco" placeholder="Ex: Protótipo jogável, Demo na Steam..." />
                        </div>

                        <div class="campoFormulario">
                            <label>Tipo de Parceria</label>

                            <div class="opcaoParceria" data-parceria="portfolio">
                                <h2>Portfólio</h2>
                                <p>Colaboração para experiência e portfólio</p>
                            </div>

                            <div class="opcaoParceria" data-parceria="revenue">
                                <h2>Revenue Share</h2>
                                <p>Divisão futura de receita</p>
                            </div>

                            <div class="opcaoParceria" data-parceria="tarefa">
                                <h2>Por Tarefa</h2>
                                <p>Participação em tarefas específicas</p>
                            </div>
                        </div>

                        <div class="campoFormulario">
                            <label for="duracaoProjeto">Duração estimada</label>
                            <input type="text" id="duracaoProjeto" placeholder="Ex: 3 meses, 6 meses..." />
                        </div>

                        <div class="botoesEtapa">
                            <button type="submit" class="botaoProximo">
                                Publicar Projeto 
                            </button>
                        </div>
                    </div>
                </form>
            </main>
        </div>

        <script src="static/js/app.js"></script>
        <script src="static/js/publicarProjeto.js"></script>
    </body>
</html>
