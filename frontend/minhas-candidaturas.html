<!doctype html>
<html lang="pt-BR" data-tema="escuro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0e100f" />
        <link rel="icon" href="static/assets/logoCor.svg" type="image/svg+xml" />
        <title>Minhas candidaturas - IndieSquad</title>

        <link rel="preload" href="static/mosaic-ui/fontes/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="static/mosaic-ui/mosaic.css" />
        <link rel="stylesheet" href="static/style/tema-indiesquad.css" />
        <link rel="stylesheet" href="static/style/indiesquad.css" />

        <script src="static/mosaic-ui/mosaic-inicio.js"></script>
        <script src="static/js/tema.js"></script>
    </head>
    <body>
        <div class="mo-app">
            <header class="mo-cabecalho">
                <a class="mo-logotipo" href="dashboard.html">
                    <span class="marcaIndieSquad" aria-hidden="true"></span>
                    <span>Indie<b>Squad</b></span>
                </a>

                <form class="mo-busca" action="busca.html" method="get" role="search">
                    <i class="mo-lupa" aria-hidden="true"></i>
                    <input type="search" name="q" data-mo-atalho="/" placeholder="Buscar pessoas ou projetos" aria-label="Buscar pessoas ou projetos" autocomplete="off" />
                    <kbd class="mo-atalho">/</kbd>
                </form>

                <button class="mo-alternar-lateral" data-mo-gaveta aria-label="Abrir menu"><i></i><i></i><i></i></button>
            </header>

            <div class="mo-corpo">
                <mo-pixels class="mo-fundo" passo="16" opacidade="0.38"></mo-pixels>

                <nav class="mo-lateral" aria-label="Navegação principal">
                    <a class="mo-nav-item" href="dashboard.html" data-mo-carregando="Dashboard">
                        <i class="mo-ponto" aria-hidden="true" style="view-transition-name: ponto-dashboard"></i>
                        <span class="mo-nav-texto">Dashboard</span>
                    </a>

                    <a class="mo-nav-item" href="busca.html" data-mo-carregando="Buscar">
                        <i class="mo-ponto" aria-hidden="true" style="view-transition-name: ponto-busca"></i>
                        <span class="mo-nav-texto">Buscar</span>
                    </a>

                    <a class="mo-nav-item" href="publicar-projeto.html" data-mo-carregando="Publicar projeto">
                        <i class="mo-ponto" aria-hidden="true" style="view-transition-name: ponto-publicar"></i>
                        <span class="mo-nav-texto">Publicar projeto</span>
                    </a>

                    <a class="mo-nav-item ativo" href="minhas-candidaturas.html" aria-current="page" data-mo-carregando="Candidaturas">
                        <i class="mo-pilula" aria-hidden="true"></i>
                        <i class="mo-ponto" aria-hidden="true" style="view-transition-name: ponto-candidaturas"></i>
                        <span class="mo-nav-texto">Candidaturas</span>
                        <span class="mo-nav-selo escondido" id="seloCandidaturas"></span>
                    </a>

                    <a class="mo-nav-item" href="perfil.html" data-mo-carregando="Meu perfil">
                        <i class="mo-ponto" aria-hidden="true" style="view-transition-name: ponto-perfil"></i>
                        <span class="mo-nav-texto">Meu perfil</span>
                    </a>

                    <div class="mo-separador"></div>

                    <div class="pePainel">
                        <button type="button" class="mo-tecla mo-tecla--sutil mo-tecla--p" onclick="fazerLogout()">
                            <span>Sair</span>
                        </button>

                        <button type="button" class="mo-tecla mo-tecla--sutil mo-tecla--p mo-tecla--icone botaoTema" onclick="trocarTema()" aria-label="Trocar entre tema claro e escuro" title="Trocar tema">
                            <mo-simbolo class="iconeSol" nome="sol"></mo-simbolo>
                            <mo-simbolo class="iconeLua" nome="lua"></mo-simbolo>
                        </button>
                    </div>
                </nav>

                <main class="mo-conteudo conteudoMedio">

                <div class="topoPagina">
                    <h1>Minhas Candidaturas</h1>
                    <h3>Acompanhe o status das vagas que você se candidatou</h3>
                </div>

                <p class="mensagemErro" id="mensagemErro"></p>

                <div class="cardsEstatisticaQuatro cardsEstatistica">
                    <div class="mo-cartao cardEstatistica">
                        <span class="valorEstatistica" id="totalPendentes">0</span>
                        <span class="legendaEstatistica">Pendentes</span>
                    </div>

                    <div class="mo-cartao cardEstatistica">
                        <span class="valorEstatistica" id="totalAceitas">0</span>
                        <span class="legendaEstatistica">Aceitas</span>
                    </div>

                    <div class="mo-cartao cardEstatistica">
                        <span class="valorEstatistica" id="totalRecusadas">0</span>
                        <span class="legendaEstatistica">Recusadas</span>
                    </div>
                </div>

                <div class="mo-grade listaResultados" id="listaCandidaturas"></div>
                </main>
            </div>
        </div>

        <div class="mo-avisos" id="avisos" role="status" aria-live="polite"></div>

        <script type="module" src="static/mosaic-ui/mosaic.js"></script>
        <script src="static/js/app.js"></script>
        <script src="static/js/minhasCandidaturas.js"></script>
    </body>
</html>
