<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{% block title %}IndieSquad{% endblock %}</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav>
            <a class="botaoLogo" href="{{ url_for('index') }}">
                <div class="logo">
                    <img src="{{ url_for('static', filename='assets/Logo.svg') }}" alt=""/>
                    <h3>INDIE<span>SQUAD</span></h3>
                </div>
            </a>

            <div class="botoesNav">
                <a class="mediaSumir" href="{{ url_for('index') }}#comoFunciona"> Como funciona? </a>
                <a class="mediaSumir" href="{{ url_for('index') }}#infraCompleta"> Estrutura </a>
                <a class="mediaSumir" href="{{ url_for('index') }}#talentos"> Talentos</a>
                <a href="{{ url_for('index') }}#pronto" class="botaoComecar"> Comecar Agora</a>
            </div>
        </nav>

        {% block content %}{% endblock %}

        <footer>
            <a class="botaoLogo" href="{{ url_for('index') }}#principal">
                <div class="logoF">
                    <img src="{{ url_for('static', filename='assets/Logo.svg') }}" alt=""/>
                    <h3>INDIE<span>SQUAD</span></h3>
                </div>
            </a>
        </footer>
    </body>
</html>
