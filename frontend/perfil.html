<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Meu Perfil - IndieSquad</title>

        <link rel="stylesheet" href="static/style/style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="appLayout">
            <aside class="sidebarApp">
                <div>
                    <div class="logoSidebar">
                        <img src="static/assets/Logo.svg" alt=""/>
                        <h3>INDIE<span>SQUAD</span></h3>
                    </div>

                    <div class="navSidebar">
                        <a href="dashboard.html" class="itemSidebar">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            Dashboard
                        </a>
                        <a href="busca.html" class="itemSidebar">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2"/></svg>
                            Buscar
                        </a>
                        <a href="publicar-projeto.html" class="itemSidebar">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                            Publicar Projeto
                        </a>
                        <a href="perfil.html" class="itemSidebar ativo">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg>
                            Meu Perfil
                        </a>
                    </div>
                </div>

                <button type="button" class="botaoSairSidebar" onclick="fazerLogout()">
                    <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="16 16 21 12 16 8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                    Sair
                </button>
            </aside>

            <main class="conteudoApp conteudoEstreito">
                <div class="publicarTopo">
                    <h1>Meu Perfil</h1>
                    <h3>Edite suas informações públicas</h3>
                </div>

                <p class="mensagemErro" id="mensagemErro"></p>
                <p class="mensagemSucesso" id="mensagemSucesso"></p>

                <form id="formPerfil">
                    <div class="campoLogin">
                        <label for="nomePerfil">Nome</label>
                        <input type="text" id="nomePerfil" required />
                    </div>

                    <div class="campoLogin">
                        <label for="emailPerfil">E-mail</label>
                        <input type="email" id="emailPerfil" required />
                    </div>

                    <div class="campoLogin">
                        <label for="bioPerfil">Bio</label>
                        <textarea id="bioPerfil" placeholder="Fale um pouco sobre você..."></textarea>
                    </div>

                    <button type="submit" class="botaoEntrarLogin">Salvar alterações</button>
                </form>

                <div class="blocoSkillsPerfil">
                    <h3>Minhas skills</h3>
                    <div class="tagsResultado" id="skillsPerfil"></div>
                </div>

                <a href="minhas-candidaturas.html" class="linkCandidaturas">Ver minhas candidaturas →</a>
            </main>
        </div>

        <script src="static/js/auth.js"></script>
        <script src="static/js/perfil.js"></script>
    </body>
</html>
