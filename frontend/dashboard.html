<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard - IndieSquad</title>

        <link rel="stylesheet" href="static/style/style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="appLayout">
            <aside class="sidebarApp">
                <div>
                    <div class="logoSidebar">
                        <img src="static/assets/Logo.svg" alt=""/>
                        <h3>INDIE<span>SQUAD</span></h3>
                    </div>

                    <div class="navSidebar">
                        <a href="dashboard.html" class="itemSidebar ativo">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            Dashboard
                        </a>
                        <a href="busca.html" class="itemSidebar">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2"/></svg>
                            Buscar
                        </a>
                        <a href="publicar-projeto.html" class="itemSidebar">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                            Publicar Projeto
                        </a>
                        <a href="perfil.html" class="itemSidebar">
                            <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg>
                            Meu Perfil
                        </a>
                    </div>
                </div>

                <button type="button" class="botaoSairSidebar" onclick="fazerLogout()">
                    <svg class="iconeSidebar" viewBox="0 0 24 24" width="18" height="18"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="16 16 21 12 16 8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"/></svg>
                    Sair
                </button>
            </aside>

            <main class="conteudoApp">
                <div class="saudacaoApp">
                    <h1>Olá, <span id="nomeUsuario">...</span>! 👋</h1>
                    <h3>Aqui está o resumo dos seus projetos</h3>
                </div>

                <div class="statsGrid">
                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statProjetosAtivos">0</span>
                        <span class="labelStat">Projetos Ativos</span>
                    </div>

                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 20c0-2 1-3.5 3-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statColaboracoes">0</span>
                        <span class="labelStat">Colaborações</span>
                    </div>

                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><polyline points="3 17 9 11 13 15 21 6" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="15 6 21 6 21 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statTaxaConclusao">0%</span>
                        <span class="labelStat">Taxa de Conclusão</span>
                    </div>

                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="4" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="10" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="16" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statTotalProjetos">0</span>
                        <span class="labelStat">Projetos Criados</span>
                    </div>
                </div>

                <div class="listaProjetosDash" id="listaProjetosDash"></div>
            </main>
        </div>

        <script src="static/js/auth.js"></script>
        <script src="static/js/dashboard.js"></script>
    </body>
</html>
