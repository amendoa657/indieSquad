<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard - IndieSquad</title>

        <link rel="stylesheet" href="static/style/style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="appLayout">
            <aside class="sidebarApp" id="menu"></aside>

            <main class="conteudoApp">
                <div class="saudacaoApp">
                    <h1>Olá, <span id="nomeUsuario">...</span>! 👋</h1>
                    <h3>Aqui está o resumo dos seus projetos</h3>
                </div>

                <div class="statsGrid">
                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statProjetosAtivos">0</span>
                        <span class="labelStat">Projetos Ativos</span>
                    </div>

                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 20c0-2 1-3.5 3-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statColaboracoes">0</span>
                        <span class="labelStat">Colaborações</span>
                    </div>

                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><polyline points="3 17 9 11 13 15 21 6" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="15 6 21 6 21 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statTaxaConclusao">0%</span>
                        <span class="labelStat">Taxa de Conclusão</span>
                    </div>

                    <div class="statCard">
                        <svg class="iconeStat" viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="4" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="10" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="16" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        <span class="valorStat" id="statTotalProjetos">0</span>
                        <span class="labelStat">Projetos Criados</span>
                    </div>
                </div>

                <div class="listaProjetosDash" id="listaProjetosDash"></div>
            </main>
        </div>

        <script src="static/js/app.js"></script>
        <script src="static/js/dashboard.js"></script>
    </body>
</html>
