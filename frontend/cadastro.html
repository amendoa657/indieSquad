<!doctype html>
<html lang="pt-BR" data-tema="escuro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="#0d1111" />
        <title>Criar conta · IndieSquad</title>
        <link rel="icon" href="static/assets/icone.svg" type="image/svg+xml" />

        <!-- o tema vem antes de tudo pra tela ja nascer na cor certa -->
        <script src="static/js/tema.js"></script>
        <script src="static/mosaic-ui/mosaic-inicio.js"></script>

        <link rel="stylesheet" href="static/mosaic-ui/mosaic.css" />
        <link rel="stylesheet" href="static/style/tokens.css" />
        <link rel="stylesheet" href="static/style/base.css" />
        <link rel="stylesheet" href="static/style/componentes.css" />
        <link rel="stylesheet" href="static/style/telas.css" />

        <script type="module" src="static/js/indie.js"></script>
    </head>
    <body class="telaEntrada">
        <mo-pixels class="mo-fundo" opacidade="0.5"></mo-pixels>

        <header class="topoEntrada">
            <a class="logoIndie" href="index.html" aria-label="IndieSquad">
                <is-marca></is-marca>
                <span class="nomeMarca">INDIE<b>SQUAD</b></span>
            </a>

            <button type="button" class="mo-tecla mo-tecla--sutil mo-tecla--icone botaoTema" onclick="trocarTema(event)" aria-label="Trocar entre tema claro e escuro" title="Trocar tema">
                            <mo-simbolo nome="sol" class="iconeSol"></mo-simbolo>
                            <mo-simbolo nome="lua" class="iconeLua"></mo-simbolo>
                        </button>
        </header>

        <main class="miolo">
            <div class="cartaoEntrada cartaoCadastro">
                <div class="janelaTopo">
                    <span>Novo jogador</span>
                    <span id="passoCadastro">1/2</span>
                </div>

                <div class="cartaoEntradaCorpo">
                    <div class="etapaPerfil" id="etapaPerfil">
                        <div class="cabecaEntrada">
                            <h1>Como você quer jogar?</h1>
                            <p class="perguntaPerfil">Dá pra mudar depois, no seu perfil.</p>
                        </div>

                        <button type="button" class="opcaoPerfil mira" data-objetivo="montarEquipe">
                            <span class="iconePerfil"><mo-simbolo nome="coroa" tamanho="27"></mo-simbolo></span>
                            <span class="tituloPerfil">Montar equipe</span>
                            <span class="textoPerfil">Tenho um projeto e preciso de gente</span>
                        </button>

                        <button type="button" class="opcaoPerfil mira" data-objetivo="entrarProjeto">
                            <span class="iconePerfil"><mo-simbolo nome="usuario" tamanho="27"></mo-simbolo></span>
                            <span class="tituloPerfil">Entrar num projeto</span>
                            <span class="textoPerfil">Quero colaborar e fortalecer meu portfólio</span>
                        </button>

                        <button type="button" class="opcaoPerfil mira" data-objetivo="ambos">
                            <span class="iconePerfil"><mo-simbolo nome="raio" tamanho="27"></mo-simbolo></span>
                            <span class="tituloPerfil">Os dois</span>
                            <span class="textoPerfil">Tenho projeto e também quero colaborar</span>
                        </button>
                    </div>

                    <div class="etapaFormulario" id="etapaFormulario">
                        <a href="#" class="mo-tecla mo-tecla--sutil mo-tecla--p botaoVoltar" id="botaoVoltar">← Voltar</a>

                        <form class="formLogin formulario" id="formCadastro">
                            <div class="campoFormulario">
                                <label for="nome">Nome</label>
                                <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required />
                            </div>

                            <div class="campoFormulario">
                                <label for="handle">Apelido</label>
                                <div class="caixaApelido">
                                    <span class="prefixoApelido">@</span>
                                    <input type="text" id="handle" name="handle" placeholder="seu_apelido" pattern="[a-z0-9_]{3,30}" required />
                                </div>
                                <div class="previaApelido">
                                    <is-sprite id="spriteApelido" semente="?" style="--is-sprite:36px"></is-sprite>
                                    <small class="dicaCampo">Esse é o seu endereço e o seu bonequinho. Letra minúscula, número e _.</small>
                                </div>
                            </div>

                            <div class="campoFormulario">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required />
                            </div>

                            <div class="campoFormulario">
                                <label for="senha">Senha</label>
                                <div class="caixaSenha">
                                    <input type="password" id="senha" name="senha" placeholder="Pelo menos 8 caracteres" minlength="8" autocomplete="new-password" required />
                                    <button type="button" class="botaoOlho" id="botaoOlho" aria-label="Mostrar a senha">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 128C147.3 128 21.6 245.7 3.5 262.4C-1.2 266.8-1.2 274.2 3.5 278.6C21.6 295.3 147.3 413 320 413C492.7 413 618.4 295.3 636.5 278.6C641.2 274.2 641.2 266.8 636.5 262.4C618.4 245.7 492.7 128 320 128zM320 349C275.3 349 239 312.7 239 268C239 223.3 275.3 187 320 187C364.7 187 401 223.3 401 268C401 312.7 364.7 349 320 349z"/></svg>
                                </button>
                                </div>
                            </div>

                            <p class="mensagemErro" id="mensagemErro"></p>

                            <button type="submit" class="mo-tecla mo-tecla--destaque mo-tecla--g botaoEnviar">
                                <mo-simbolo nome="play"></mo-simbolo>
                                Criar conta
                            </button>
                        </form>
                    </div>
                </div>

                <a class="linkCadastro" href="login.html">Já tem conta? <span>Entrar</span></a>
            </div>
        </main>

        <p class="peEntrada">monte a equipe que termina o jogo</p>

        <script src="static/js/app.js"></script>
        <script src="static/js/cadastro.js"></script>
    </body>
</html>
